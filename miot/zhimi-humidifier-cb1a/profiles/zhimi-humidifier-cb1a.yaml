      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aBuzzer
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aScreenBrightness
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aChildLock
      version: 1

preferences:
- name: ipAddress
  title: IP Address
  description: Zhimi Humidifier CB1A의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Zhimi Humidifier CB1A의 토큰 (32자리 hex)
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: 갱신주기 (초)
  description: 얼마나 자주 갱신할지 설정 (기본값 60초)
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: on off 전환시 또다른 Zhimi Humidifier CB1A 기기를 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
