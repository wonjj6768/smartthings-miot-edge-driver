    version: 1
  - component: main
    capability: concertmirror08464.zhimiHumCb1aTargetHumidity
    version: 1
  - component: main
    capability: concertmirror08464.zhimiHumCb1aDry
    version: 1
  - component: main
    capability: concertmirror08464.zhimiHumCb1aBuzzer
    version: 1
  - component: main
    capability: concertmirror08464.zhimiHumCb1aScreenBrightness
    version: 1
  - component: main
    capability: concertmirror08464.zhimiHumCb1aChildLock
    version: 1
  - component: main
    capability: refresh
    version: 1
  automation:
    conditions:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: temperatureMeasurement
      version: 1
    - component: main
      capability: relativeHumidityMeasurement
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aFanLevel
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aTargetHumidity
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aDry
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aBuzzer
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aScreenBrightness
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aChildLock
      version: 1
    actions:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aFanLevel
      version: 1
    - component: main
      capability: concertmirror08464.zhimiHumCb1aTargetHumidity
      version: 1
    - component: main
