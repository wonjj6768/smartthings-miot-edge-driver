name: zhimi-humidifier-cb1a
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: temperatureMeasurement
    version: 1
  - id: relativeHumidityMeasurement
    version: 1
  - id: concertmirror08464.zhimiHumCb1aFanLevel
    version: 1
  - id: concertmirror08464.zhimiHumCb1aTargetHumidity
