preferences:
- name: ipAddress
  title: IP Address
  description: Mijia Mist-Free Humidifier 3 1500mL/h의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ''
- name: token
  title: Token
  description: Mijia Mist-Free Humidifier 3 1500mL/h의 토큰 (32자리 hex)
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ''
- name: pollingInterval
  title: 갱신주기 (초)
  description: 상태 갱신 주기 (기본값 60초)
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: 켜면 Mijia Mist-Free Humidifier 3 1500mL/h 기기를 추가로 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
