name: xiaomi-air-purifier-cpa5
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: concertmirror08464.xiaomiAirCpa5Mode
    version: 1
  - id: fineDustSensor
    version: 1
  - id: filterState
    version: 1
  - id: concertmirror08464.xiaomiAirCpa5Buzzer
    version: 1
  - id: concertmirror08464.xiaomiAirCpa5PetLock
    version: 1
  - id: concertmirror08464.xiaomiAirCpa5DisplayLevel
    version: 1
  - id: concertmirror08464.xiaomiAirCpa5FanLevel
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: AirPurifier
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: switch
        version: 1
        group: main
        values:
          - label: "{{switch.value}}"
        composite: true
      - component: main
        capability: fineDustSensor
        version: 1
        group: main
        values:
          - label: " PM2.5: {{fineDustLevel.value}}"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
    basicPlus: []
  detailView:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiAirCpa5Mode
      version: 1
    - component: main
      capability: fineDustSensor
      version: 1
    - component: main
      capability: filterState
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiAirCpa5Buzzer
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiAirCpa5PetLock
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiAirCpa5DisplayLevel
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiAirCpa5FanLevel
      version: 1
    - component: main
      capability: refresh
      version: 1
  automation:
    conditions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5Mode
        version: 1
      - component: main
        capability: fineDustSensor
        version: 1
      - component: main
        capability: filterState
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5Buzzer
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5PetLock
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5DisplayLevel
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5FanLevel
        version: 1
    actions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5Mode
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5Buzzer
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5PetLock
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5DisplayLevel
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiAirCpa5FanLevel
        version: 1

preferences:
- name: ipAddress
  title: IP Address
  description: Xiaomi Smart Pet Care Air Purifier의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Xiaomi Smart Pet Care Air Purifier의 32자리 토큰
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: 갱신주기 (초)
  description: 상태를 조회할 주기
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: 켜면 같은 모델의 새 기기를 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
