preferences:
- name: ipAddress
  title: IP Address
  description: Mijia Smart DC Inverter Circulation Fan Pro의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Mijia Smart DC Inverter Circulation Fan Pro의 32자리 토큰
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: Polling Interval
  description: 상태 갱신 주기(초)
  required: true
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: Create Device
  description: 토글하면 새 장치를 생성합니다.
  required: true
  preferenceType: boolean
  definition:
    default: false
