name: yeelink-light-color2
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: switchLevel
    version: 1
  - id: statelessSwitchLevelStep
    version: 1
  - id: colorTemperature
    version: 1
  - id: colorControl
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Light
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: switch
        version: 1
        group: main
        values:
          - label: "{{switch.value}}"
        composite: true
      - component: main
        capability: switchLevel
        version: 1
        group: main
        values:
          - label: " {{level.value}}{{level.unit}}"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
    basicPlus: []
  detailView:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: switchLevel
      version: 1
    - component: main
      capability: colorTemperature
      version: 1
    - component: main
      capability: colorControl
      version: 1
    - component: main
      capability: refresh
      version: 1
  automation:
    conditions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: switchLevel
        version: 1
      - component: main
        capability: colorTemperature
        version: 1
      - component: main
        capability: colorControl
        version: 1
    actions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: switchLevel
        version: 1
      - component: main
        capability: statelessSwitchLevelStep
        version: 1
      - component: main
        capability: colorTemperature
        version: 1
      - component: main
        capability: colorControl
        version: 1
preferences:
- name: ipAddress
  title: IP Address
  description: Yeelight Color Bulb V2의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Yeelight Color Bulb V2의 토큰 (32자리 hex)
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: 갱신주기 (초)
  description: 얼마나 자주 갱신할지 설정 (기본값 60초)
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: on off 전환시 또다른 Yeelight Color Bulb V2 기기를 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
